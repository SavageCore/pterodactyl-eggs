name: Validate eggs

on:
  pull_request:
    paths:
      - 'eggs/**/egg-*.json'
      - 'schema/**'
      - 'scripts/**'
  push:
    branches: [main]
    paths:
      - 'eggs/**/egg-*.json'
      - 'schema/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - run: npm ci
        working-directory: scripts

      - name: Get changed egg files
        id: changed
        if: github.event_name == 'pull_request'
        run: |
          files=$(git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD -- 'eggs/**/egg-*.json' | tr '\n' ' ')
          echo "files=$files" >> $GITHUB_OUTPUT

      - name: Validate changed eggs
        if: github.event_name == 'pull_request' && steps.changed.outputs.files != ''
        run: node scripts/validate-eggs.mjs ${{ steps.changed.outputs.files }}

      - name: Validate all eggs
        if: github.event_name != 'pull_request'
        run: node scripts/validate-eggs.mjs
